name: PostgreSQL security checks
on:
  push:
    paths: ['supabase/migrations/**', 'tests/postgres/**', 'scripts/test-postgres.sh', '.github/workflows/test-postgres.yml']
  pull_request:
    paths: ['supabase/migrations/**', 'tests/postgres/**', 'scripts/test-postgres.sh', '.github/workflows/test-postgres.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash scripts/test-postgres.sh
