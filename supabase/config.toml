project_id = "zyvnndmxyatquecaungj"

[auth]
enable_signup = true
enable_anonymous_sign_ins = false
jwt_expiry = 600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 5
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 1800
max_frequency = "60s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(YBRD_TURNSTILE_SECRET)"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 20
token_verifications = 20
